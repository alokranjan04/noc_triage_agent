<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOC Triage Agent — Dashboard</title>
<style>
/* ------------------------------------------------------------------ */
/*  Design tokens                                                      */
/* ------------------------------------------------------------------ */
:root {
  --bg-primary:    #0f1117;
  --bg-secondary:  #161b22;
  --bg-card:       #1c2128;
  --bg-hover:      #252b35;
  --bg-input:      #0d1117;
  --border:        #30363d;
  --border-focus:  #58a6ff;
  --text-primary:  #e6edf3;
  --text-secondary:#8b949e;
  --text-muted:    #6e7681;
  --accent:        #58a6ff;
  --accent-dim:    #1f6feb;
  --green:         #3fb950;
  --green-bg:      rgba(63,185,80,.12);
  --yellow:        #d29922;
  --yellow-bg:     rgba(210,153,34,.12);
  --red:           #f85149;
  --red-bg:        rgba(248,81,73,.12);
  --orange:        #db6d28;
  --orange-bg:     rgba(219,109,40,.12);
  --purple:        #bc8cff;
  --radius:        12px;
  --radius-sm:     8px;
  --shadow:        0 2px 12px rgba(0,0,0,.4);
  --transition:    .2s ease;
  --font:          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

/* ------------------------------------------------------------------ */
/*  Reset & base                                                       */
/* ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }

/* ------------------------------------------------------------------ */
/*  Layout                                                             */
/* ------------------------------------------------------------------ */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}
header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: .85rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
header .brand {
  display: flex;
  align-items: center;
  gap: .75rem;
}
header .brand .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent-dim), var(--accent));
  border-radius: var(--radius-sm);
  display: grid; place-items: center;
  font-size: 1.1rem; font-weight: 700; color: #fff;
}
header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
header .subtitle { font-size: .8rem; color: var(--text-secondary); }
header .actions { display: flex; gap: .5rem; align-items: center; }

.main-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  height: calc(100vh - 56px);
  overflow: hidden;
}

/* ------------------------------------------------------------------ */
/*  Left pane — dashboard                                              */
/* ------------------------------------------------------------------ */
.dashboard {
  padding: 1.5rem;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* Summary bar */
.summary-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.summary-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  transition: border-color var(--transition), transform var(--transition);
}
.summary-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.summary-card .label { font-size: .75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .25rem; }
.summary-card .value { font-size: 1.8rem; font-weight: 700; font-family: var(--font-mono); }
.summary-card .detail { font-size: .78rem; color: var(--text-muted); margin-top: .15rem; }
.summary-card.healthy .value { color: var(--green); }
.summary-card.warning .value { color: var(--yellow); }
.summary-card.critical .value { color: var(--red); }
.summary-card.info .value { color: var(--accent); }

/* Section headers */
.section-title {
  font-size: .85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-secondary);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Cell grid */
.cell-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.cell-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative;
  overflow: hidden;
}
.cell-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
  transition: background var(--transition);
}
.cell-card.healthy::before { background: var(--green); }
.cell-card.p2::before { background: var(--yellow); }
.cell-card.p1::before { background: var(--red); }
.cell-card.has-ticket::before { background: var(--purple); }

.cell-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.cell-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), var(--shadow);
}
.cell-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: .75rem;
}
.cell-card .cell-name {
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 600;
}
.cell-card .cell-meta {
  font-size: .78rem;
  color: var(--text-secondary);
  margin-top: .15rem;
}

/* Status badge */
.badge {
  font-size: .7rem;
  font-weight: 600;
  padding: .2rem .6rem;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .04em;
  white-space: nowrap;
}
.badge.healthy { background: var(--green-bg); color: var(--green); }
.badge.p2      { background: var(--yellow-bg); color: var(--yellow); }
.badge.p1      { background: var(--red-bg);    color: var(--red); }
.badge.ticket  { background: rgba(188,140,255,.12); color: var(--purple); }
.badge.none    { background: rgba(139,148,158,.12); color: var(--text-secondary); }

/* KPI bars in card */
.kpi-bars { display: flex; flex-direction: column; gap: .5rem; }
.kpi-row {
  display: grid;
  grid-template-columns: 130px 1fr 50px;
  align-items: center;
  gap: .5rem;
  font-size: .78rem;
}
.kpi-row .kpi-label { color: var(--text-secondary); font-family: var(--font-mono); font-size: .72rem; }
.kpi-row .kpi-value { text-align: right; font-family: var(--font-mono); font-weight: 600; }
.kpi-bar-track {
  height: 6px;
  background: var(--bg-primary);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.kpi-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .6s cubic-bezier(.22,1,.36,1);
}
.kpi-bar-fill.ok      { background: var(--green); }
.kpi-bar-fill.warning  { background: var(--yellow); }
.kpi-bar-fill.critical { background: var(--red); }

/* Breach list */
.breach-list { margin-top: .75rem; }
.breach-item {
  font-size: .75rem;
  padding: .35rem .6rem;
  background: var(--red-bg);
  border: 1px solid rgba(248,81,73,.2);
  border-radius: var(--radius-sm);
  color: var(--red);
  margin-bottom: .35rem;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: .4rem;
}
.breach-item .breach-icon { font-size: .85rem; }

/* Ticket section */
.ticket-section { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); }
.ticket-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.ticket-info { font-size: .8rem; }
.ticket-id { font-family: var(--font-mono); font-weight: 600; color: var(--purple); }

/* Action button */
.btn {
  font-size: .78rem;
  font-weight: 600;
  padding: .45rem 1rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  transition: all var(--transition);
}
.btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
.btn.primary:hover { background: var(--accent); }
.btn.danger { background: rgba(248,81,73,.15); border-color: rgba(248,81,73,.3); color: var(--red); }
.btn.danger:hover { background: rgba(248,81,73,.25); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite;
  margin-right: .4rem; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Detail panel (when a cell is selected) */
.detail-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  animation: slideIn .3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.detail-panel .detail-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.detail-panel .detail-title {
  font-size: 1.2rem;
  font-weight: 700;
  font-family: var(--font-mono);
}
.detail-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}
.detail-kpi {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem;
  text-align: center;
}
.detail-kpi .dk-label { font-size: .72rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
.detail-kpi .dk-value { font-size: 1.6rem; font-weight: 700; font-family: var(--font-mono); margin: .25rem 0; }
.detail-kpi .dk-threshold { font-size: .72rem; color: var(--text-muted); }
.detail-kpi.ok .dk-value { color: var(--green); }
.detail-kpi.breach .dk-value { color: var(--red); }

/* Tickets table */
.tickets-table-wrap { margin-top: 1.5rem; }
.tickets-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .82rem;
}
.tickets-table th {
  text-align: left;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-secondary);
  padding: .6rem .75rem;
  border-bottom: 1px solid var(--border);
}
.tickets-table td {
  padding: .65rem .75rem;
  border-bottom: 1px solid var(--border);
}
.tickets-table tr:hover td { background: var(--bg-hover); }
.tickets-table .mono { font-family: var(--font-mono); font-weight: 600; }

/* Eval results */
.eval-summary-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: .75rem;
  margin-bottom: 1.25rem;
}
.eval-summary-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .85rem 1rem;
  text-align: center;
}
.eval-summary-card .es-label { font-size: .68rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
.eval-summary-card .es-value { font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); margin: .15rem 0; }
.eval-summary-card.pass .es-value { color: var(--green); }
.eval-summary-card.warn .es-value { color: var(--yellow); }

.eval-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: .75rem;
}
.eval-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.15rem;
  position: relative;
  overflow: hidden;
  transition: border-color var(--transition), transform var(--transition);
  cursor: default;
}
.eval-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.eval-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.eval-card.pass::before { background: var(--green); }
.eval-card.fail::before { background: var(--red); }
.eval-card .ec-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
.eval-card .ec-id { font-family: var(--font-mono); font-size: .82rem; font-weight: 600; }
.eval-card .ec-badges { display: flex; gap: .35rem; flex-wrap: wrap; }
.eval-card .ec-prompt { font-size: .78rem; color: var(--text-secondary); margin-bottom: .6rem; font-style: italic; }
.eval-card .ec-tools { font-size: .72rem; color: var(--text-muted); margin-bottom: .5rem; font-family: var(--font-mono); }
.eval-card .ec-scores { display: flex; gap: 1rem; }
.eval-card .ec-score { flex: 1; }
.eval-card .ec-score-label { font-size: .65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.eval-card .ec-score-bar { height: 6px; background: var(--bg-primary); border-radius: 3px; overflow: hidden; margin: .25rem 0; }
.eval-card .ec-score-fill { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.22,1,.36,1); }
.eval-card .ec-score-fill.high { background: var(--green); }
.eval-card .ec-score-fill.mid  { background: var(--yellow); }
.eval-card .ec-score-fill.low  { background: var(--red); }
.eval-card .ec-score-val { font-size: .75rem; font-family: var(--font-mono); font-weight: 600; }

/* Golden dataset */
.gd-tabs {
  display: flex;
  gap: .35rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.gd-tab {
  font-size: .78rem;
  font-weight: 600;
  padding: .45rem 1rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all var(--transition);
}
.gd-tab:hover { border-color: var(--accent); color: var(--text-primary); }
.gd-tab.active { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
.gd-tab .tab-count { font-size: .68rem; opacity: .7; margin-left: .3rem; }

.gd-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: .75rem;
  overflow: hidden;
  transition: border-color var(--transition);
}
.gd-card:hover { border-color: var(--border-focus); }
.gd-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .85rem 1.15rem;
  cursor: pointer;
  user-select: none;
}
.gd-card-header:hover { background: var(--bg-hover); }
.gd-card-left { display: flex; align-items: center; gap: .75rem; flex: 1; min-width: 0; }
.gd-card-num {
  font-family: var(--font-mono);
  font-size: .72rem;
  font-weight: 700;
  color: var(--accent);
  background: rgba(88,166,255,.1);
  padding: .2rem .5rem;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.gd-card-prompt {
  font-size: .82rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gd-card-right { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
.gd-card-chevron {
  font-size: .85rem;
  color: var(--text-muted);
  transition: transform var(--transition);
}
.gd-card.open .gd-card-chevron { transform: rotate(90deg); }

.gd-card-body {
  display: none;
  padding: 0 1.15rem 1.15rem;
  animation: slideIn .25s ease;
}
.gd-card.open .gd-card-body { display: block; }

.gd-field { margin-bottom: .85rem; }
.gd-field-label {
  font-size: .68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-muted);
  margin-bottom: .3rem;
}
.gd-field-value {
  font-size: .82rem;
  color: var(--text-primary);
  line-height: 1.55;
}
.gd-field-value.mono {
  font-family: var(--font-mono);
  font-size: .78rem;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .55rem .75rem;
}
.gd-field-value .tool-step {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  background: rgba(88,166,255,.08);
  border: 1px solid rgba(88,166,255,.2);
  border-radius: var(--radius-sm);
  padding: .25rem .55rem;
  margin: .15rem .25rem .15rem 0;
  font-family: var(--font-mono);
  font-size: .72rem;
  color: var(--accent);
}
.gd-field-value .tool-arrow { color: var(--text-muted); margin: 0 .15rem; }
.gd-assertions { display: flex; flex-wrap: wrap; gap: .35rem; }
.gd-assert {
  font-size: .72rem;
  font-family: var(--font-mono);
  padding: .2rem .55rem;
  border-radius: var(--radius-sm);
}
.gd-assert.include { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,.2); }
.gd-assert.exclude { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,81,73,.2); }
.gd-reqs { display: flex; flex-wrap: wrap; gap: .25rem; }
.gd-req {
  font-size: .65rem;
  font-family: var(--font-mono);
  padding: .15rem .45rem;
  border-radius: 12px;
  background: rgba(188,140,255,.1);
  color: var(--purple);
  border: 1px solid rgba(188,140,255,.2);
}

/* ------------------------------------------------------------------ */
/*  Right pane — chat                                                  */
/* ------------------------------------------------------------------ */
.chat-pane {
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100%;
}
.chat-header {
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: .9rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.chat-header .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .4; }
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.chat-msg {
  max-width: 88%;
  padding: .7rem 1rem;
  border-radius: var(--radius);
  font-size: .85rem;
  line-height: 1.55;
  animation: msgIn .25s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.chat-msg.user {
  align-self: flex-end;
  background: var(--accent-dim);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-msg.agent {
  align-self: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.chat-msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: .78rem;
  text-align: center;
  padding: .4rem;
}
.chat-msg.error {
  align-self: flex-start;
  background: var(--red-bg);
  border: 1px solid rgba(248,81,73,.2);
  color: var(--red);
  font-size: .8rem;
}

.chat-input-wrap {
  padding: .75rem 1.25rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .5rem;
}
.chat-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .6rem .9rem;
  color: var(--text-primary);
  font-size: .85rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition);
}
.chat-input:focus { border-color: var(--border-focus); }
.chat-input::placeholder { color: var(--text-muted); }

/* Quick action buttons */
.quick-actions {
  padding: .5rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}
.quick-btn {
  font-size: .72rem;
  padding: .3rem .65rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
}
.quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }

/* ------------------------------------------------------------------ */
/*  Toast notification                                                 */
/* ------------------------------------------------------------------ */
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  pointer-events: none;
}
.toast {
  padding: .65rem 1.25rem;
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-weight: 500;
  animation: toastIn .3s ease, toastOut .3s ease 2.7s forwards;
  pointer-events: auto;
  box-shadow: var(--shadow);
}
.toast.success { background: var(--green); color: #fff; }
.toast.error   { background: var(--red);   color: #fff; }
.toast.info    { background: var(--accent-dim); color: #fff; }
@keyframes toastIn  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(12px); } }

/* ------------------------------------------------------------------ */
/*  Responsive                                                         */
/* ------------------------------------------------------------------ */
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
  .chat-pane { height: 45vh; border-left: none; border-top: 1px solid var(--border); }
}

/* ------------------------------------------------------------------ */
/*  Loading skeleton                                                   */
/* ------------------------------------------------------------------ */
.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { to { background-position: -200% 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NOC Triage Agent</h1>
        <div class="subtitle">Mobile Network Cell Monitoring</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="loadCells()" title="Refresh data">&#x21bb; Refresh</button>
      <button class="btn danger" onclick="resetTickets()" title="Clear session tickets">Clear Tickets</button>
    </div>
  </header>

  <div class="main-grid">
    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <!-- Summary bar (filled by JS) -->
      <div class="summary-bar" id="summaryBar"></div>

      <!-- Detail panel (shown when a cell is selected) -->
      <div id="detailPanel"></div>

      <!-- Cell grid -->
      <div class="section-title">Cell Overview</div>
      <div class="cell-grid" id="cellGrid">
        <!-- Skeleton loaders -->
        <div class="cell-card"><div class="skeleton" style="height:160px"></div></div>
        <div class="cell-card"><div class="skeleton" style="height:160px"></div></div>
        <div class="cell-card"><div class="skeleton" style="height:160px"></div></div>
        <div class="cell-card"><div class="skeleton" style="height:160px"></div></div>
      </div>

      <!-- Tickets table -->
      <div class="section-title" style="margin-top:1.5rem">Tickets</div>
      <div class="tickets-table-wrap" id="ticketsWrap">
        <div class="skeleton" style="height:100px"></div>
      </div>

      <!-- Eval results -->
      <div class="section-title" style="margin-top:2rem">Eval Results (15 Cases)</div>
      <div id="evalSummary"></div>
      <div class="eval-grid" id="evalGrid">
        <div class="eval-card"><div class="skeleton" style="height:120px"></div></div>
        <div class="eval-card"><div class="skeleton" style="height:120px"></div></div>
        <div class="eval-card"><div class="skeleton" style="height:120px"></div></div>
      </div>

      <!-- Golden Dataset (Editable) -->
      <div class="section-title" style="margin-top:2.5rem">
        Golden Dataset
        <button onclick="showAddCaseForm()" style="
          margin-left:1rem; padding:.35rem 1rem; border-radius:var(--radius-sm);
          background:var(--green); color:#fff; border:none;
          font-size:.72rem; font-weight:600; cursor:pointer;
        ">+ Add Case</button>
        <button onclick="resetCases()" style="
          margin-left:.5rem; padding:.35rem 1rem; border-radius:var(--radius-sm);
          background:var(--bg-hover); color:var(--text-secondary); border:1px solid var(--border);
          font-size:.72rem; font-weight:500; cursor:pointer;
        ">Reset to Default</button>
        <span id="caseCount" style="margin-left:.75rem; font-size:.72rem; color:var(--text-muted)"></span>
      </div>
      <div class="gd-tabs" id="gdTabs"></div>

      <!-- Add/Edit Case Form (hidden by default) -->
      <div id="caseFormContainer" style="display:none; margin-bottom:1rem;">
        <div style="background:var(--bg-card); border:1px solid var(--border-focus); border-radius:var(--radius); padding:1.25rem;">
          <div style="font-weight:600; font-size:.9rem; margin-bottom:1rem;" id="caseFormTitle">Add New Case</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;">
            <div>
              <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Case ID *</label>
              <input id="cf_id" placeholder="c16_my_case" style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:var(--font-mono); font-size:.78rem;">
            </div>
            <div>
              <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Category</label>
              <select id="cf_category" style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem;">
                <option value="happy_path">Happy Path</option>
                <option value="guardrail">Guardrail</option>
                <option value="intent">Intent Handling</option>
              </select>
            </div>
          </div>
          <div style="margin-top:.75rem">
            <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Prompt *</label>
            <textarea id="cf_prompt" rows="2" placeholder='Triage CELL-1002.' style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem; resize:vertical; font-family:var(--font);"></textarea>
          </div>
          <div style="margin-top:.75rem">
            <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Reference Response</label>
            <textarea id="cf_ref" rows="2" placeholder="Expected agent response..." style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem; resize:vertical; font-family:var(--font);"></textarea>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:.75rem;">
            <div>
              <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Must Include (comma-separated)</label>
              <input id="cf_must_include" placeholder='TCK-1002, P2, 3.4' style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem; font-family:var(--font-mono);">
            </div>
            <div>
              <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Must NOT Include (comma-separated)</label>
              <input id="cf_must_not_include" placeholder='P1, TCK-' style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem; font-family:var(--font-mono);">
            </div>
          </div>
          <div style="margin-top:.75rem">
            <label style="font-size:.72rem; color:var(--text-secondary); display:block; margin-bottom:.25rem">Expected Tools (JSON array, optional)</label>
            <input id="cf_tools" placeholder='[{"name":"get_cell_kpis","args":{"cell_id":"CELL-1002"}}]' style="width:100%; padding:.45rem .6rem; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:.78rem; font-family:var(--font-mono);">
          </div>
          <div style="display:flex; gap:.5rem; margin-top:1rem;">
            <button onclick="saveCaseForm()" style="padding:.4rem 1.2rem; border-radius:var(--radius-sm); background:var(--accent-dim); color:#fff; border:1px solid var(--accent); font-size:.78rem; font-weight:600; cursor:pointer;">Save</button>
            <button onclick="hideCaseForm()" style="padding:.4rem 1.2rem; border-radius:var(--radius-sm); background:var(--bg-hover); color:var(--text-secondary); border:1px solid var(--border); font-size:.78rem; cursor:pointer;">Cancel</button>
            <span id="caseFormError" style="color:var(--red); font-size:.72rem; align-self:center"></span>
          </div>
        </div>
      </div>

      <div id="gdCards">
        <div class="gd-card"><div class="skeleton" style="height:80px"></div></div>
        <div class="gd-card"><div class="skeleton" style="height:80px"></div></div>
      </div>

      <!-- Live Eval Runner -->
      <div class="section-title" style="margin-top:2.5rem">
        Live Eval Runner
        <button id="runEvalsBtn" onclick="runLiveEvals()" style="
          margin-left:1rem; padding:.4rem 1.2rem; border-radius:var(--radius-sm);
          background:var(--accent-dim); color:#fff; border:1px solid var(--accent);
          font-size:.78rem; font-weight:600; cursor:pointer; transition:var(--transition);
        ">Run All Cases</button>
        <span id="evalRunStatus" style="margin-left:.75rem; font-size:.78rem; color:var(--text-secondary)"></span>
      </div>
      <div id="evalRunSummary" style="margin-bottom:.75rem"></div>
      <div id="evalRunResults" style="display:flex; flex-direction:column; gap:.5rem; margin-bottom:2rem"></div>
    </div>

    <!-- Chat pane -->
    <div class="chat-pane">
      <div class="chat-header">
        <div class="dot"></div>
        Agent Chat
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg system">Ask the agent to triage a cell, e.g. "Triage CELL-1002"</div>
      </div>
      <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('Triage CELL-1002.')">Triage CELL-1002</button>
        <button class="quick-btn" onclick="sendQuick('Triage CELL-1004.')">Triage CELL-1004</button>
        <button class="quick-btn" onclick="sendQuick('Triage CELL-1007.')">Triage CELL-1007</button>
        <button class="quick-btn" onclick="sendQuick('Is CELL-1001 healthy?')">Check CELL-1001</button>
        <button class="quick-btn" onclick="sendQuick('Reboot CELL-1004.')">Reboot CELL-1004</button>
        <button class="quick-btn" onclick="sendQuick('Open a P3 ticket for CELL-1006.')">P3 for CELL-1006</button>
      </div>
      <div class="chat-input-wrap">
        <input class="chat-input" id="chatInput" placeholder="Ask the agent..." autocomplete="off">
        <button class="btn primary" id="chatSend" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// =======================================================================
//  State
// =======================================================================
let cellsData = [];
let selectedCellId = null;

// =======================================================================
//  API helpers
// =======================================================================
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

// =======================================================================
//  Load cells
// =======================================================================
async function loadCells() {
  try {
    cellsData = await fetchJSON('/api/cells');
    renderSummary();
    renderCellGrid();
    loadTickets();
    if (selectedCellId) renderDetail(selectedCellId);
  } catch (e) {
    toast('Failed to load cell data', 'error');
  }
}

// =======================================================================
//  Summary bar
// =======================================================================
function renderSummary() {
  const total = cellsData.length;
  const healthy = cellsData.filter(c => c.suggested_priority === 'NONE').length;
  const p2Count = cellsData.filter(c => c.suggested_priority === 'P2').length;
  const p1Count = cellsData.filter(c => c.suggested_priority === 'P1').length;
  const withTicket = cellsData.filter(c => c.open_ticket_id).length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-card info">
      <div class="label">Total Cells</div>
      <div class="value">${total}</div>
      <div class="detail">Monitored cells</div>
    </div>
    <div class="summary-card healthy">
      <div class="label">Healthy</div>
      <div class="value">${healthy}</div>
      <div class="detail">All KPIs within thresholds</div>
    </div>
    <div class="summary-card warning">
      <div class="label">P2 Breaching</div>
      <div class="value">${p2Count}</div>
      <div class="detail">Major threshold breach</div>
    </div>
    <div class="summary-card critical">
      <div class="label">P1 Critical</div>
      <div class="value">${p1Count}</div>
      <div class="detail">Availability &lt; 95%</div>
    </div>
  `;
}

// =======================================================================
//  Cell grid
// =======================================================================
function renderCellGrid() {
  const grid = document.getElementById('cellGrid');
  grid.innerHTML = cellsData.map(c => {
    const prio = c.suggested_priority || 'NONE';
    const cls = c.open_ticket_id ? 'has-ticket' : (prio === 'NONE' ? 'healthy' : prio.toLowerCase());
    const badgeCls = c.open_ticket_id ? 'ticket' : (prio === 'NONE' ? 'healthy' : prio.toLowerCase());
    const badgeText = c.open_ticket_id ? c.open_ticket_id : (prio === 'NONE' ? 'Healthy' : prio);
    const sel = c.cell_id === selectedCellId ? ' selected' : '';

    return `
    <div class="cell-card ${cls}${sel}" onclick="selectCell('${c.cell_id}')">
      <div class="card-header">
        <div>
          <div class="cell-name">${c.cell_id}</div>
          <div class="cell-meta">${c.site_id} &middot; ${c.region}</div>
        </div>
        <span class="badge ${badgeCls}">${badgeText}</span>
      </div>
      <div class="kpi-bars">
        ${renderKpiBar('Drop Rate', c.kpis.drop_call_rate_pct, 2.0, '%', true)}
        ${renderKpiBar('PRB Util', c.kpis.prb_utilization_pct, 85.0, '%', true)}
        ${renderKpiBar('Availability', c.kpis.availability_pct, 99.0, '%', false)}
        ${renderKpiBar('Throughput', c.kpis.avg_throughput_mbps, 5.0, ' Mbps', false)}
      </div>
      ${c.breaches && c.breaches.length ? `
        <div class="breach-list">
          ${c.breaches.map(b => `<div class="breach-item"><span class="breach-icon">&#x26a0;</span> ${b.kpi} ${b.value} vs ${b.threshold}</div>`).join('')}
        </div>` : ''}
      ${c.open_ticket_id ? `
        <div class="ticket-section">
          <div class="ticket-row">
            <span class="ticket-info">Open ticket: <span class="ticket-id">${c.open_ticket_id}</span></span>
            <span class="badge ticket">Existing</span>
          </div>
        </div>` : ''}
    </div>`;
  }).join('');
}

function renderKpiBar(label, value, threshold, unit, higherIsBad) {
  let pct, cls;
  if (higherIsBad) {
    pct = Math.min((value / (threshold * 2)) * 100, 100);
    cls = value > threshold ? (value > threshold * 1.5 ? 'critical' : 'warning') : 'ok';
  } else {
    pct = Math.min((value / 100) * 100, 100);
    cls = value < threshold ? (value < threshold * 0.96 ? 'critical' : 'warning') : 'ok';
  }
  return `
  <div class="kpi-row">
    <span class="kpi-label">${label}</span>
    <div class="kpi-bar-track"><div class="kpi-bar-fill ${cls}" style="width:${pct}%"></div></div>
    <span class="kpi-value">${value}${unit}</span>
  </div>`;
}

// =======================================================================
//  Detail panel
// =======================================================================
function selectCell(cellId) {
  selectedCellId = selectedCellId === cellId ? null : cellId;
  renderCellGrid();
  if (selectedCellId) renderDetail(selectedCellId);
  else document.getElementById('detailPanel').innerHTML = '';
}

function renderDetail(cellId) {
  const c = cellsData.find(x => x.cell_id === cellId);
  if (!c) return;

  const kpis = [
    { key: 'drop_call_rate_pct', label: 'Drop Call Rate', unit: '%', threshold: 2.0, higherBad: true },
    { key: 'prb_utilization_pct', label: 'PRB Utilization', unit: '%', threshold: 85.0, higherBad: true },
    { key: 'availability_pct', label: 'Availability', unit: '%', threshold: 99.0, higherBad: false },
    { key: 'avg_throughput_mbps', label: 'Avg Throughput', unit: ' Mbps', threshold: 5.0, higherBad: false },
  ];

  const prio = c.suggested_priority || 'NONE';
  const canCreateTicket = prio !== 'NONE' && !c.open_ticket_id;

  document.getElementById('detailPanel').innerHTML = `
  <div class="detail-panel">
    <div class="detail-header">
      <div>
        <div class="detail-title">${c.cell_id}</div>
        <div style="font-size:.82rem;color:var(--text-secondary)">${c.site_id} &middot; ${c.region} &middot; Window: ${c.window_end}</div>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span class="badge ${prio === 'NONE' ? 'healthy' : prio.toLowerCase()}">${prio === 'NONE' ? 'Healthy' : 'Suggested ' + prio}</span>
        ${canCreateTicket ? `<button class="btn primary" onclick="createTicket('${c.cell_id}','${prio}')">Create ${prio} Ticket</button>` : ''}
        ${c.open_ticket_id ? `<span class="badge ticket">${c.open_ticket_id}</span>` : ''}
        <button class="btn" onclick="selectCell(null)">&times;</button>
      </div>
    </div>
    <div class="detail-kpis">
      ${kpis.map(k => {
        const val = c.kpis[k.key];
        const breached = k.higherBad ? val > k.threshold : val < k.threshold;
        return `
        <div class="detail-kpi ${breached ? 'breach' : 'ok'}">
          <div class="dk-label">${k.label}</div>
          <div class="dk-value">${val}${k.unit}</div>
          <div class="dk-threshold">Threshold: ${k.higherBad ? '>' : '<'} ${k.threshold}${k.unit}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// =======================================================================
//  Tickets
// =======================================================================
async function loadTickets() {
  const tickets = await fetchJSON('/api/tickets');
  const wrap = document.getElementById('ticketsWrap');
  if (!tickets.length) {
    wrap.innerHTML = '<div style="color:var(--text-muted);font-size:.85rem;padding:1rem">No tickets yet.</div>';
    return;
  }
  wrap.innerHTML = `
  <table class="tickets-table">
    <thead><tr><th>Ticket ID</th><th>Cell</th><th>Priority</th><th>Status</th><th>Summary</th></tr></thead>
    <tbody>
      ${tickets.map(t => `
        <tr>
          <td class="mono" style="color:var(--purple)">${t.ticket_id}</td>
          <td class="mono">${t.cell_id}</td>
          <td><span class="badge ${t.priority === 'P1' ? 'p1' : t.priority === 'P2' ? 'p2' : 'none'}">${t.priority}</span></td>
          <td>${t.status}</td>
          <td style="font-size:.78rem;color:var(--text-secondary)">${t.summary || ''}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

async function createTicket(cellId, priority) {
  const result = await fetchJSON('/api/tickets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cell_id: cellId, priority }),
  });
  if (result.status === 'created') {
    toast(`Ticket ${result.ticket_id} created (${result.priority})`, 'success');
  } else if (result.status === 'exists') {
    toast(`Ticket ${result.ticket_id} already exists`, 'info');
  } else {
    toast(result.message || 'Error creating ticket', 'error');
  }
  loadCells();
}

async function resetTickets() {
  await fetchJSON('/api/tickets/reset', { method: 'POST' });
  toast('Session tickets cleared', 'info');
  selectedCellId = null;
  loadCells();
}

// =======================================================================
//  Chat
// =======================================================================
function addChatMsg(text, type) {
  const el = document.createElement('div');
  el.className = `chat-msg ${type}`;
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  addChatMsg(msg, 'user');

  const sendBtn = document.getElementById('chatSend');
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span>';

  try {
    const result = await fetchJSON('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    if (result.status === 'ok') {
      addChatMsg(result.reply, 'agent');
    } else {
      addChatMsg(result.reply || 'Error from agent', 'error');
    }
    loadCells(); // refresh dashboard after agent action
  } catch (e) {
    addChatMsg('Network error — is the server running?', 'error');
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
}

function sendQuick(msg) {
  document.getElementById('chatInput').value = msg;
  sendChat();
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

// =======================================================================
//  Toast
// =======================================================================
function toast(message, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// =======================================================================
//  Eval results
// =======================================================================
async function loadEvals() {
  try {
    const evals = await fetchJSON('/api/evals');
    renderEvalSummary(evals);
    renderEvalGrid(evals);
  } catch (e) {
    console.error('Failed to load evals', e);
  }
}

function renderEvalSummary(evals) {
  const total = evals.length;
  const passed = evals.filter(e => e.passed).length;
  const safety = evals.filter(e => e.safety);
  const safetyPassed = safety.filter(e => e.passed).length;
  const avgTraj = evals.reduce((s, e) => s + (e.trajectory_score || 0), 0) / total;
  const avgResp = evals.reduce((s, e) => s + (e.response_score || 0), 0) / total;

  document.getElementById('evalSummary').innerHTML = `
    <div class="eval-summary-bar">
      <div class="eval-summary-card ${passed === total ? 'pass' : 'warn'}">
        <div class="es-label">Cases Passed</div>
        <div class="es-value">${passed}/${total}</div>
      </div>
      <div class="eval-summary-card pass">
        <div class="es-label">Trajectory Avg</div>
        <div class="es-value">${avgTraj.toFixed(3)}</div>
      </div>
      <div class="eval-summary-card ${avgResp >= 0.5 ? 'pass' : 'warn'}">
        <div class="es-label">Response Avg</div>
        <div class="es-value">${avgResp.toFixed(3)}</div>
      </div>
      <div class="eval-summary-card ${safetyPassed === safety.length ? 'pass' : 'warn'}">
        <div class="es-label">Safety Cases</div>
        <div class="es-value">${safetyPassed}/${safety.length}</div>
      </div>
    </div>`;
}

function renderEvalGrid(evals) {
  document.getElementById('evalGrid').innerHTML = evals.map(e => {
    const cls = e.passed ? 'pass' : 'fail';
    const tScore = e.trajectory_score != null ? e.trajectory_score : 0;
    const rScore = e.response_score != null ? e.response_score : 0;
    const tCls = tScore >= 0.9 ? 'high' : tScore >= 0.5 ? 'mid' : 'low';
    const rCls = rScore >= 0.5 ? 'high' : rScore >= 0.3 ? 'mid' : 'low';
    const toolsStr = e.expected_tools.length ? e.expected_tools.join(' → ') : '(no tools)';

    return `
    <div class="eval-card ${cls}">
      <div class="ec-header">
        <div class="ec-id">${e.id}</div>
        <div class="ec-badges">
          ${e.safety ? '<span class="badge p1" style="font-size:.6rem">SAFETY</span>' : ''}
          <span class="badge ${cls === 'pass' ? 'healthy' : 'p1'}" style="font-size:.6rem">${cls === 'pass' ? 'PASS' : 'FAIL'}</span>
        </div>
      </div>
      <div class="ec-prompt">"${e.prompt}"</div>
      <div class="ec-tools">Tools: ${toolsStr}</div>
      <div class="ec-scores">
        <div class="ec-score">
          <div class="ec-score-label">Trajectory</div>
          <div class="ec-score-bar"><div class="ec-score-fill ${tCls}" style="width:${tScore * 100}%"></div></div>
          <div class="ec-score-val" style="color:var(--${tCls === 'high' ? 'green' : tCls === 'mid' ? 'yellow' : 'red'})">${tScore.toFixed(2)}</div>
        </div>
        <div class="ec-score">
          <div class="ec-score-label">Response</div>
          <div class="ec-score-bar"><div class="ec-score-fill ${rCls}" style="width:${rScore * 100}%"></div></div>
          <div class="ec-score-val" style="color:var(--${rCls === 'high' ? 'green' : rCls === 'mid' ? 'yellow' : 'red'})">${rScore.toFixed(2)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// =======================================================================
//  Golden Dataset (Editable)
// =======================================================================
let _gdData = [];
let _gdFilter = 'all';
let _editingCaseId = null; // null = add mode, string = edit mode

const _catLabels = {
  all:        'All',
  happy_path: 'Happy Paths',
  guardrail:  'Guardrails',
  intent:     'Intent Handling',
};

async function loadGoldenDataset() {
  try {
    _gdData = await fetchJSON('/api/evals/cases');
    document.getElementById('caseCount').textContent = `${_gdData.length} cases`;
    renderGoldenTabs();
    renderGoldenCards();
  } catch (e) {
    console.error('Failed to load golden dataset', e);
  }
}

function renderGoldenTabs() {
  const counts = { all: _gdData.length, happy_path: 0, guardrail: 0, intent: 0 };
  _gdData.forEach(c => {
    const cat = c.category || 'other';
    if (counts[cat] !== undefined) counts[cat]++;
  });

  document.getElementById('gdTabs').innerHTML = Object.entries(_catLabels).map(([key, label]) => `
    <button class="gd-tab ${_gdFilter === key ? 'active' : ''}" onclick="setGdFilter('${key}')">
      ${label}<span class="tab-count">${counts[key]}</span>
    </button>
  `).join('');
}

function setGdFilter(cat) {
  _gdFilter = cat;
  renderGoldenTabs();
  renderGoldenCards();
}

function renderGoldenCards() {
  const filtered = _gdFilter === 'all' ? _gdData : _gdData.filter(c => (c.category || 'other') === _gdFilter);
  const container = document.getElementById('gdCards');

  container.innerHTML = filtered.map((c, i) => {
    const num = String(i + 1).padStart(2, '0');
    const cat = c.category || 'other';
    const catClass = cat === 'happy_path' ? 'healthy' : cat === 'guardrail' ? 'p2' : 'p3';
    const catLabel = _catLabels[cat] || cat;

    // Tool steps
    const tools = c.expected_tools || [];
    const toolsHtml = tools.map((t, ti) => {
      const argsStr = t.args ? Object.entries(t.args).map(([k,v]) => `${k}=${v}`).join(', ') : '';
      return `<div class="tool-step">
        <span style="color:var(--text-muted);font-size:.7rem;margin-right:.4rem">${ti+1}.</span>
        <span style="color:var(--accent);font-weight:600">${t.name}</span>${argsStr ? `<span class="tool-arrow">(</span>${argsStr}<span class="tool-arrow">)</span>` : ''}
      </div>`;
    }).join('');
    const noTools = !tools.length ? '<span style="color:var(--text-muted);font-style:italic">No tool calls expected</span>' : '';

    // Assertions
    const includeHtml = (c.must_include || []).map(p => `<span class="gd-assert include">${escapeHTML(p)}</span>`).join('');
    const excludeHtml = (c.must_not_include || []).map(p => `<span class="gd-assert exclude">${escapeHTML(p)}</span>`).join('');
    const assertionsHtml = (includeHtml || excludeHtml) ? `
      <div class="gd-field">
        <div class="gd-field-label">Assertions</div>
        <div class="gd-assertions">${includeHtml}${excludeHtml}</div>
      </div>` : '';

    // REQs
    const reqsHtml = (c.reqs || []).map(r => `<span class="gd-req">${r}</span>`).join('');

    return `
    <div class="gd-card" id="gd-${c.id}">
      <div class="gd-card-header" onclick="toggleGdCard('${c.id}')">
        <div class="gd-card-left">
          <div class="gd-card-num">${num}</div>
          <div>
            <div style="font-weight:600;font-size:.88rem">${escapeHTML(c.id)}</div>
            <div class="gd-card-prompt">"${escapeHTML(c.prompt)}"</div>
          </div>
        </div>
        <div class="gd-card-right">
          <span class="badge ${catClass}" style="font-size:.62rem">${catLabel}</span>
          <button onclick="event.stopPropagation(); editCase('${c.id}')" style="padding:.2rem .5rem; border-radius:4px; background:var(--bg-hover); border:1px solid var(--border); color:var(--accent); font-size:.62rem; cursor:pointer;">Edit</button>
          <button onclick="event.stopPropagation(); deleteCase('${c.id}')" style="padding:.2rem .5rem; border-radius:4px; background:var(--bg-hover); border:1px solid var(--border); color:var(--red); font-size:.62rem; cursor:pointer;">Del</button>
          <span class="gd-card-chevron">▶</span>
        </div>
      </div>
      <div class="gd-card-body">
        <div class="gd-field">
          <div class="gd-field-label">Prompt</div>
          <div class="gd-field-value mono">${escapeHTML(c.prompt)}</div>
        </div>
        <div class="gd-field">
          <div class="gd-field-label">Expected Tool Calls</div>
          <div class="gd-field-value mono">${toolsHtml || noTools}</div>
        </div>
        <div class="gd-field">
          <div class="gd-field-label">Reference Response</div>
          <div class="gd-field-value">${escapeHTML(c.reference_response || '')}</div>
        </div>
        ${assertionsHtml}
        ${reqsHtml ? `<div class="gd-field"><div class="gd-field-label">Requirements</div><div class="gd-reqs">${reqsHtml}</div></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleGdCard(id) {
  document.getElementById('gd-' + id)?.classList.toggle('open');
}

// --- Case CRUD ---

function showAddCaseForm() {
  _editingCaseId = null;
  document.getElementById('caseFormTitle').textContent = 'Add New Case';
  document.getElementById('cf_id').value = '';
  document.getElementById('cf_id').disabled = false;
  document.getElementById('cf_category').value = 'happy_path';
  document.getElementById('cf_prompt').value = '';
  document.getElementById('cf_ref').value = '';
  document.getElementById('cf_must_include').value = '';
  document.getElementById('cf_must_not_include').value = '';
  document.getElementById('cf_tools').value = '';
  document.getElementById('caseFormError').textContent = '';
  document.getElementById('caseFormContainer').style.display = 'block';
  document.getElementById('cf_id').focus();
}

function editCase(caseId) {
  const c = _gdData.find(x => x.id === caseId);
  if (!c) return;
  _editingCaseId = caseId;
  document.getElementById('caseFormTitle').textContent = `Edit: ${caseId}`;
  document.getElementById('cf_id').value = c.id;
  document.getElementById('cf_id').disabled = true;
  document.getElementById('cf_category').value = c.category || 'happy_path';
  document.getElementById('cf_prompt').value = c.prompt || '';
  document.getElementById('cf_ref').value = c.reference_response || '';
  document.getElementById('cf_must_include').value = (c.must_include || []).join(', ');
  document.getElementById('cf_must_not_include').value = (c.must_not_include || []).join(', ');
  document.getElementById('cf_tools').value = c.expected_tools?.length ? JSON.stringify(c.expected_tools) : '';
  document.getElementById('caseFormError').textContent = '';
  document.getElementById('caseFormContainer').style.display = 'block';
  document.getElementById('cf_prompt').focus();
}

function hideCaseForm() {
  document.getElementById('caseFormContainer').style.display = 'none';
  _editingCaseId = null;
}

function _parseCommaList(val) {
  return val.split(',').map(s => s.trim()).filter(Boolean);
}

async function saveCaseForm() {
  const id = document.getElementById('cf_id').value.trim();
  const prompt = document.getElementById('cf_prompt').value.trim();
  const errEl = document.getElementById('caseFormError');

  if (!id || !prompt) { errEl.textContent = 'ID and Prompt are required'; return; }

  let expectedTools = [];
  const toolsVal = document.getElementById('cf_tools').value.trim();
  if (toolsVal) {
    try { expectedTools = JSON.parse(toolsVal); }
    catch { errEl.textContent = 'Invalid JSON in Expected Tools'; return; }
  }

  const caseObj = {
    id: id,
    category: document.getElementById('cf_category').value,
    prompt: prompt,
    reference_response: document.getElementById('cf_ref').value.trim(),
    must_include: _parseCommaList(document.getElementById('cf_must_include').value),
    must_not_include: _parseCommaList(document.getElementById('cf_must_not_include').value),
    expected_tools: expectedTools,
    reqs: [],
  };

  try {
    let resp;
    if (_editingCaseId) {
      resp = await fetch(`/api/evals/cases/${_editingCaseId}`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(caseObj)
      });
    } else {
      resp = await fetch('/api/evals/cases', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(caseObj)
      });
    }
    const result = await resp.json();
    if (result.status === 'error') { errEl.textContent = result.message; return; }

    hideCaseForm();
    await loadGoldenDataset();
  } catch (e) {
    errEl.textContent = `Error: ${e.message}`;
  }
}

async function deleteCase(caseId) {
  if (!confirm(`Delete case "${caseId}"?`)) return;
  try {
    await fetch(`/api/evals/cases/${caseId}`, { method: 'DELETE' });
    await loadGoldenDataset();
  } catch (e) {
    console.error('Delete failed', e);
  }
}

async function resetCases() {
  if (!confirm('Reset all cases to the original cases.yaml? Custom cases will be lost.')) return;
  try {
    await fetch('/api/evals/cases/reset', { method: 'POST' });
    await loadGoldenDataset();
  } catch (e) {
    console.error('Reset failed', e);
  }
}

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// =======================================================================
//  Live Eval Runner
// =======================================================================
let evalRunning = false;

async function runLiveEvals() {
  if (evalRunning) return;
  evalRunning = true;

  const btn = document.getElementById('runEvalsBtn');
  const status = document.getElementById('evalRunStatus');
  const summary = document.getElementById('evalRunSummary');
  const container = document.getElementById('evalRunResults');

  btn.disabled = true;
  btn.style.opacity = '0.5';
  btn.textContent = 'Running...';
  const totalCases = _gdData.length;
  status.textContent = `Starting eval run (${totalCases} cases)...`;
  summary.innerHTML = '';
  container.innerHTML = '';

  const results = [];

  try {
    const resp = await fetch('/api/evals/run', { method: 'POST' });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const r = JSON.parse(line);
          results.push(r);
          status.textContent = `Running: ${results.length}/${totalCases} complete...`;
          renderEvalRunResult(container, r, results.length);
        } catch (e) { /* skip bad lines */ }
      }
    }

    // Process remaining buffer
    if (buffer.trim()) {
      try {
        const r = JSON.parse(buffer);
        results.push(r);
        renderEvalRunResult(container, r, results.length);
      } catch (e) { /* skip */ }
    }

    // Summary
    const passed = results.filter(r => r.status === 'pass').length;
    const total = results.length;
    const safetyTotal = results.filter(r => r.safety).length;
    const safetyPassed = results.filter(r => r.safety && r.status === 'pass').length;

    const allPass = passed === total;
    const safetyPass = safetyPassed === safetyTotal;

    summary.innerHTML = `
      <div style="display:flex; gap:1.5rem; flex-wrap:wrap; padding:.75rem 0;">
        <div style="padding:.5rem 1rem; border-radius:var(--radius-sm);
          background:${allPass ? 'var(--green-bg)' : 'var(--red-bg)'};
          border:1px solid ${allPass ? 'var(--green)' : 'var(--red)'};">
          <span style="font-size:1.1rem; font-weight:700; color:${allPass ? 'var(--green)' : 'var(--red)'}">
            ${passed}/${total}
          </span>
          <span style="color:var(--text-secondary); font-size:.78rem"> cases passed</span>
        </div>
        <div style="padding:.5rem 1rem; border-radius:var(--radius-sm);
          background:${safetyPass ? 'var(--green-bg)' : 'var(--red-bg)'};
          border:1px solid ${safetyPass ? 'var(--green)' : 'var(--red)'};">
          <span style="font-size:1.1rem; font-weight:700; color:${safetyPass ? 'var(--green)' : 'var(--red)'}">
            ${safetyPassed}/${safetyTotal}
          </span>
          <span style="color:var(--text-secondary); font-size:.78rem"> safety cases</span>
        </div>
      </div>`;

    status.textContent = allPass ? 'All cases passed!' : `${total - passed} case(s) failed`;
    status.style.color = allPass ? 'var(--green)' : 'var(--red)';

  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    status.style.color = 'var(--red)';
  }

  btn.disabled = false;
  btn.style.opacity = '1';
  btn.textContent = 'Run All Cases';
  evalRunning = false;
}

function renderEvalRunResult(container, r, num) {
  const isPassed = r.status === 'pass';
  const statusColor = isPassed ? 'var(--green)' : r.status === 'error' ? 'var(--orange)' : 'var(--red)';
  const statusBg = isPassed ? 'var(--green-bg)' : r.status === 'error' ? 'var(--orange-bg)' : 'var(--red-bg)';
  const statusLabel = isPassed ? 'PASS' : r.status === 'error' ? 'ERROR' : 'FAIL';

  const toolsHtml = r.tools_called && r.tools_called.length > 0
    ? r.tools_called.map(t => `<span style="background:var(--bg-hover); padding:.15rem .45rem; border-radius:4px; font-size:.7rem; font-family:var(--font-mono)">${escapeHTML(t)}</span>`).join(' ')
    : '<span style="color:var(--text-muted); font-size:.72rem">No tools called</span>';

  const reasonsHtml = r.reasons && r.reasons.length > 0
    ? `<div style="margin-top:.4rem; font-size:.72rem; color:var(--red)">${r.reasons.map(x => escapeHTML(x)).join('<br>')}</div>`
    : '';

  const responseHtml = r.response
    ? `<div style="margin-top:.4rem; font-size:.72rem; color:var(--text-secondary); font-style:italic; max-height:3rem; overflow:hidden">${escapeHTML(r.response)}</div>`
    : '';

  const card = document.createElement('div');
  card.style.cssText = `
    display:flex; align-items:flex-start; gap:.75rem; padding:.75rem 1rem;
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm);
    animation: fadeIn .3s ease;
  `;
  card.innerHTML = `
    <div style="
      min-width:52px; text-align:center; padding:.3rem .5rem; border-radius:4px;
      background:${statusBg}; color:${statusColor}; font-weight:700; font-size:.75rem;
    ">${statusLabel}</div>
    <div style="flex:1; min-width:0">
      <div style="display:flex; align-items:center; gap:.5rem; flex-wrap:wrap">
        <span style="font-weight:600; font-size:.82rem">${escapeHTML(r.id)}</span>
        ${r.safety ? '<span class="badge p1" style="font-size:.58rem">SAFETY</span>' : ''}
        <span style="color:var(--text-muted); font-size:.7rem">#${num}</span>
      </div>
      <div style="margin-top:.35rem; display:flex; gap:.35rem; flex-wrap:wrap">${toolsHtml}</div>
      ${reasonsHtml}
      ${responseHtml}
    </div>`;
  container.appendChild(card);

  // Auto-scroll to show latest result
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// =======================================================================
//  Boot
// =======================================================================
loadCells();
loadEvals();
loadGoldenDataset();
</script>
