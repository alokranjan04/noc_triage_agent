name: Deploy to Cloud Run

on:
  workflow_dispatch:  # Manual trigger only — go to Actions tab → Run workflow

env:
  GCP_REGION: us-central1
  SERVICE_NAME: noc-triage-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create .env for deployment
        run: |
          printf '%s\n' \
            "OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}" \
            "OPENROUTER_MODEL=google/gemini-2.5-flash" \
            "GOOGLE_GENAI_USE_VERTEXAI=FALSE" \
            "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            "GOOGLE_CLOUD_LOCATION=us-central1" \
            > noc_triage_agent/.env

      - name: Deploy to Cloud Run (source-based)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source=. \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --max-instances=3 \
            --set-env-vars="OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }},OPENROUTER_MODEL=google/gemini-2.5-flash"

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test — health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
          echo "Health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
