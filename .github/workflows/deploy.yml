name: Deploy to Cloud Run

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - "noc_triage_agent/**"
      - ".github/workflows/deploy.yml"

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: noc-triage-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create agent .env for deployment
        run: |
          cat > noc_triage_agent/.env << 'ENVEOF'
          OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}
          OPENROUTER_MODEL=google/gemini-2.5-flash
          GOOGLE_GENAI_USE_VERTEXAI=FALSE
          GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION=us-central1
          ENVEOF

      - name: Deploy to Cloud Run via ADK
        run: |
          uv run adk deploy cloud_run \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --service_name=${{ env.SERVICE_NAME }} \
            --with_ui \
            noc_triage_agent \
            -- --allow-unauthenticated

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test — health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
